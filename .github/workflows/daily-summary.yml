name: Daily AI Creator Radar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-summary.yml"
      - "data/config.github.json"
      - "profiles/ai-creator/**"
  schedule:
    # GitHub Actions uses UTC. 00:30 UTC = 08:30 Asia/Shanghai.
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare configuration
        run: cp data/config.github.json data/config.json

      - name: Generate daily briefing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run horizon --hours 24

      - name: Publish briefing site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "AI Radar: ${{ github.run_id }}"
